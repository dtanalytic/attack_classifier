    params:
      params.yaml:
        seed: 0
      dvc_pipes/bert/params_bert.yaml:
        nn.batch_size: 8
        nn.epoch_num: 9
        nn.exp_gamma: 0.95
        nn.l2: 4.5e-05
        nn.learning_rate: 0.005
        nn.maxlen: 128
