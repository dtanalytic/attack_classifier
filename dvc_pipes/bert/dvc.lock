      size: 18350
    - path: src/train_bert_emb.py
      hash: md5
      md5: c164047729bd6652201439286e59dd14
      size: 726
    params:
      params.yaml:
        seed: 1
      dvc_pipes/bert/params_bert.yaml:
        nn.batch_size: 8
        nn.epoch_num: 9
        nn.exp_gamma: 0.95
        nn.l2: 4.5e-05
        nn.learning_rate: 0.005
        nn.maxlen: 128
        nn.milestone_gamma: 0.5
        nn.milestone_l:
        - 4
        - 8
        nn_bert.bert_type: secbert_plus
        nn_bert.drop_ratio: 0.7
        nn_bert.from_existing: false
        nn_bert.mode: cls
        nn_bert.thresh_l_fn: data/out/bert/thresh_l.pkl
        nn_bert.thresh_split: val
