schema: '2.0'
stages:
  make_bert_emb:
    cmd: python src/train_bert_emb.py dvc_pipes/bert/params_bert.yaml
    deps:
    - path: data/interim/data_df.csv
      hash: md5
      md5: e915bde20f5180cb869015bb1178b6f1
      size: 71858123
    - path: data/interim/mlb.pkl
